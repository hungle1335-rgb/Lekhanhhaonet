<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopLink Activation</title>
    <style>
        /* Toàn màn hình với nền tối chuyển màu dịu */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at 80% 20%, #201314 0%, #0d0d11 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Hộp thoại trung tâm */
        .activation-card {
            background-color: #16151a;
            border: 1px solid #232228;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 35px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            box-sizing: border-box;
        }

        /* Logo ShopLink (Bấm giữ/chạm vào đây để mở Admin) */
        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
            background: linear-gradient(to right, #ffffff 50%, #ff5252 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none; /* Tránh bị bôi đen văn bản khi chạm nhiều lần */
            -webkit-user-select: none;
            cursor: pointer;
        }

        /* Vùng chứa nội dung bên trong */
        .inner-box {
            border: 1px solid #252024;
            background-color: #111013;
            border-radius: 12px;
            padding: 24px 20px;
        }

        /* Nhãn CHƯA CẤP PHÉP / ĐÃ KÍCH HOẠT */
        .status-badge {
            display: inline-block;
            color: #ff4444;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px dashed #ff4444;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 18px;
            background-color: rgba(255, 68, 68, 0.05);
        }
        
        .status-badge.success {
            color: #00e676;
            border-color: #00e676;
            background-color: rgba(0, 230, 118, 0.05);
        }

        /* Đoạn văn bản mô tả ngắn */
        .description {
            font-size: 13px;
            color: #8c8a94;
            line-height: 1.6;
            margin: 0 0 25px 0;
            text-align: left;
        }

        /* Tiêu đề vùng nhập Key */
        .input-label {
            font-size: 13px;
            color: #e2e1e6;
            text-align: left;
            margin-bottom: 8px;
            font-weight: 500;
            display: flex;
            align-items: center;
        }
        
        .input-label span {
            margin-right: 6px;
        }

        /* Hàng chứa ô nhập và nút bấm */
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Ô nhập Key */
        .key-input {
            flex: 1;
            background-color: #0d0d0f;
            border: 1px solid #2b2a33;
            border-radius: 6px;
            padding: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .key-input:focus {
            border-color: #ff5252;
        }

        /* Nút Kích Hoạt */
        .btn-activate {
            background: linear-gradient(135deg, #ff8a00, #e52e71);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            padding: 12px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        /* ================= VÙNG DÀNH CHO ADMIN CẢM ỨNG ================= */
        .admin-panel {
            display: none; /* Ẩn mặc định */
            background-color: #1c1a22;
            border: 1px solid #ff8a00;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            margin-top: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .admin-title {
            font-size: 14px;
            font-weight: bold;
            color: #ff8a00;
            margin-bottom: 15px;
            text-align: left;
            display: flex;
            justify-content: space-between;
        }
        .admin-btn {
            background-color: #ff8a00;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .key-list {
            margin-top: 15px;
            text-align: left;
            font-size: 13px;
            max-height: 120px;
            overflow-y: auto;
            background: #0d0d0f;
            padding: 10px;
            border-radius: 6px;
        }
        .key-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #222;
            align-items: center;
        }
        .delete-btn {
            color: #ff4444;
            padding: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- GIAO DIỆN NGƯỜI DÙNG -->
    <div class="activation-card">
        <!-- Thêm sự kiện onclick kích hoạt admin bí mật -->
        <div class="logo" onclick="handleLogoClick()">ShopLink</div>
        
        <div class="inner-box">
            <div id="statusBadge" class="status-badge">CHƯA CẤP PHÉP</div>
            
            <p id="descText" class="description">
                Thiết bị của bạn chưa được cấp quyền truy cập. Bạn có thể kích hoạt nhanh bằng <strong>Mã Key</strong> hoặc gửi ID thiết bị cho Admin.
            </p>
            
            <div class="input-label">
                <span>🔑</span> Nhập Mã Key Kích Hoạt:
            </div>
            
            <div class="input-group">
                <input type="text" id="activationKeyInput" class="key-input" placeholder="VD: VIP-8A2B-X7K1-9M4P">
                <button onclick="checkKey()" class="btn-activate">
                    ⚡ Kích Hoạt
                </button>
            </div>
        </div>
    </div>

    <!-- BẢNG ĐIỀU KHIỂN BÍ MẬT TRÊN ĐIỆN THOẠI -->
    <div id="adminPanel" class="admin-panel">
        <div class="admin-title">
            <span>🛠️ ADMIN PANEL</span>
            <span style="font-size: 11px; color:#8c8a94">Chạm 5 lần logo để ẩn</span>
        </div>
        <div class="input-group">
            <input type="text" id="newKeyInput" class="key-input" style="border-color: #ff8a00;" placeholder="Nhập Key cần tạo...">
            <button onclick="generateKey()" class="admin-btn">Tạo</button>
        </div>
        <div class="key-list" id="keyList">
            <!-- Danh sách Key tự động hiển thị ở đây -->
        </div>
    </div>

    <script>
        // --- 1. MẸO CHẠM BÍ MẬT TRÊN ĐIỆN THOẠI ---
        let clickCount = 0;
        let lastClickTime = 0;

        function handleLogoClick() {
            const currentTime = new Date().getTime();
            
            // Nếu khoảng cách giữa 2 lần bấm quá 1 giây thì reset đếm lại từ đầu
            if (currentTime - lastClickTime > 1000) {
                clickCount = 0;
            }
            
            clickCount++;
            lastClickTime = currentTime;

            // Khi chạm liên tục đủ 5 lần vào chữ "ShopLink"
            if (clickCount === 5) {
                clickCount = 0; // reset
                toggleAdminPanel();
            }
        }

        function toggleAdminPanel() {
            const adminPanel = document.getElementById('adminPanel');
            if (adminPanel.style.display === 'block') {
                adminPanel.style.display = 'none';
            } else {
                adminPanel.style.display = 'block';
                renderKeyList();
            }
        }

        // --- 2. QUẢN LÝ LƯU TRỮ KEY TRÊN TRÌNH DUYỆT ĐIỆN THOẠI ---
        function getStoredKeys() {
            const keys = localStorage.getItem('shoplink_mobile_keys');
            return keys ? JSON.parse(keys) : [];
        }

        function generateKey() {
            const input = document.getElementById('newKeyInput');
            const keyText = input.value.trim();
            
            if (!keyText) {
                alert('Hãy nhập ký tự cho Key!');
                return;
            }

            let currentKeys = getStoredKeys();
            if (currentKeys.includes(keyText)) {
                alert('Mã Key này đã được tạo trước đó!');
                return;
            }

            currentKeys.push(keyText);
            localStorage.setItem('shoplink_mobile_keys', JSON.stringify(currentKeys));
            input.value = '';
            renderKeyList();
        }

        function deleteKey(index) {
            if(confirm("Bạn muốn xóa Key này chứ?")) {
                let currentKeys = getStoredKeys();
                currentKeys.splice(index, 1);
                localStorage.setItem('shoplink_mobile_keys', JSON.stringify(currentKeys));
                renderKeyList();
            }
        }

        function renderKeyList() {
            const keyListDiv = document.getElementById('keyList');
            const keys = getStoredKeys();
            
            let html = `<strong>Danh sách Key trên máy (${keys.length}):</strong>`;
